<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm gray paper background -->
  <rect width="1200" height="630" fill="#C9CAC6" />
  
  <!-- Subtle grid lines -->
  <g stroke="#262626" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>
  
  <!-- ER_ Blob -->
  <path d="M850,220 C920,200 970,260 980,330 C990,400 930,460 860,470 C790,480 730,430 710,360 C690,290 780,240 850,220 Z" fill="#262626" />
  
  <!-- "ER_" inside blob -->
  <text x="850" y="360"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="Menlo, Monaco, Consolas, 'Courier New', monospace"
        font-weight="700"
        font-size="72"
        fill="#C9CAC6">ER_</text>

  <!-- Big text -->
  <text x="100" y="320"
        font-family="Menlo, Monaco, Consolas, 'Courier New', monospace"
        font-weight="700"
        font-size="56"
        letter-spacing="-2"
        fill="#262626">Human intention,</text>
        
  <!-- Subtitle / rest of phrase -->
  <text x="100" y="400"
        font-family="Menlo, Monaco, Consolas, 'Courier New', monospace"
        font-weight="700"
        font-size="56"
        letter-spacing="-2"
        fill="#333333">amplified by AI.</text>
</svg>
