<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  
  <!-- Background with soft border -->
  <rect width="512" height="512" rx="120" fill="url(#darkBg)" />
  <rect x="20" y="20" width="472" height="472" rx="100" stroke="url(#platinum)" stroke-width="12" stroke-opacity="0.3"/>
  
  <!-- "ER" Text -->
  <text x="50%" y="54%" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="280" 
        fill="url(#platinum)"
        style="letter-spacing: -15px; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));">
    ER
  </text>
</svg>
